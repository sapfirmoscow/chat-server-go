name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в тот же PR отменяет предыдущий запуск.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL для тестов sqlstore: тот же набор, что гоняется на memory и SQLite.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat -d chat"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TEST_POSTGRES_URL: postgres://chat:chat@localhost:5432/chat?sslmode=disable
        run: go test -race -count=1 ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Validate docker-compose.yml
        run: |
          docker compose config -q
          JWT_SECRET=x docker compose --profile app config -q

      - name: Build image
        run: docker build -t chat-server:ci .

      - name: Refuses to start without JWT_SECRET
        run: |
          if docker run --rm chat-server:ci > out.log 2>&1; then
            echo "server started without JWT_SECRET"; cat out.log; exit 1
          fi
          grep -q "JWT_SECRET is required" out.log

      - name: Smoke test and graceful shutdown
        run: |
          docker run -d --name chat -p 8080:8080 -e JWT_SECRET="$(openssl rand -hex 32)" chat-server:ci
          trap 'docker logs chat' EXIT

          # Ждём, пока сервер начнёт отвечать (401 на /me без токена).
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/me || true)
            [ "$code" = "401" ] && break
            sleep 1
          done
          [ "$code" = "401" ] || { echo "server did not become ready"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/register \
            -d '{"username":"alice","password":"secret1"}')
          [ "$code" = "201" ] || { echo "register returned $code"; exit 1; }

          # docker stop шлёт SIGTERM: сервер должен остановиться сам и с кодом 0.
          docker stop chat
          docker logs chat 2>&1 | grep -q "Server stopped"
          [ "$(docker inspect -f '{{.State.ExitCode}}' chat)" = "0" ]
