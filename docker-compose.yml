# Локальный PostgreSQL для разработки:
#   docker compose up -d
#   STORAGE_DRIVER=postgres DATABASE_URL=postgres://chat:chat@localhost:5432/chat?sslmode=disable go run ./cmd/server
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
